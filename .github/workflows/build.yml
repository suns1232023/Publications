
name: Build Publication Outputs

on:
  push:
    branches:
      - main
    paths:
      - "publications.yaml"
      - "scripts/build.py"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Publications
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Build publication outputs
        run: python scripts/build.py

      - name: Upload generated outputs
        uses: actions/upload-artifact@v4
        with:
          name: publication-registry-${{ github.run_id }}
          path: |
            generated/publications.json
            generated/bibliography.bib
            README.md
          retention-days: 30
