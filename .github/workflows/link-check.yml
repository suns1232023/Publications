
name: Publication Link Check

on:
  schedule:
    - cron: "17 2 * * 1"   # Every Monday 02:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  link-check:
    name: Check External URLs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install pyyaml requests

      - name: Check external links
        run: python scripts/link_check.py

      - name: Upload link report
        uses: actions/upload-artifact@v4
        with:
          name: publication-link-report-${{ github.run_id }}
          path: generated/link-status.json
          retention-days: 90
          if-no-files-found: warn
