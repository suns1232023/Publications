
name: Auto-Generate README from publications.json

on:
  push:
    branches: [main, master]
    paths:
      - "publications.json"          # Trigger only when data changes
      - "scripts/generate_readme.py" # Or when the generator changes
  workflow_dispatch:                 # Allow manual trigger from GitHub UI

jobs:
  generate-readme:
    name: Regenerate README.md
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate publications.json
        run: |
          echo "Validating JSON syntax …"
          python -m json.tool publications.json > /dev/null
          echo "[PASS] JSON is valid"

          echo "Validating required fields …"
          python - << 'EOF'
          import json, sys

          with open("publications.json") as f:
              data = json.load(f)

          required_pub_fields = ["id", "category", "title", "authors", "date", "status", "abstract"]
          required_cat_ids = {c["id"] for c in data["categories"]}
          errors = []

          for i, pub in enumerate(data["publications"]):
              for field in required_pub_fields:
                  if field not in pub:
                      errors.append(f"Publication #{i} missing field: {field}")
              if pub.get("category") not in required_cat_ids:
                  errors.append(f"Publication '{pub.get('id')}' has unknown category: {pub.get('category')}")

          # Check for duplicate IDs
          ids = [p["id"] for p in data["publications"]]
          dupes = [id for id in ids if ids.count(id) > 1]
          if dupes:
              errors.append(f"Duplicate publication IDs: {set(dupes)}")

          if errors:
              for e in errors:
                  print(f"[ERROR] {e}")
              sys.exit(1)

          print(f"[PASS] {len(data['publications'])} publications validated")
          EOF

      - name: Generate README.md
        run: |
          python scripts/generate_readme.py

      - name: Check if README changed
        id: diff
        run: |
          if git diff --quiet README.md; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "README.md is already up to date"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "README.md has changes"
            git diff --stat README.md
          fi

      - name: Commit and push updated README
        if: steps.diff.outputs.changed == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: auto-regenerate README.md from publications.json [skip ci]"
          file_pattern: "README.md"
          commit_author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "41898282+github-actions[bot]@users.noreply.github.com"
